name: example
description: Demonstrates how to use the fl_pip plugin.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  fl_pip:
    path: ../
  flutter_waya: ^11.5.2

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/